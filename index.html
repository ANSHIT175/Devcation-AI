
<!DOCTYPE html>
<html>
<head>
  <title>Devcation AI</title>
  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      color: white;
      text-align: center;
      padding-top: 100px;
    }
    input {
      padding: 10px;
      width: 250px;
      border-radius: 5px;
      border: none;
    }
    button {
      padding: 10px 20px;
      background: orange;
      border: none;
      border-radius: 5px;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>🚀 Devcation AI</h1>
  <p>Find personalized internships, hackathons & resources</p>

  <input id="input" placeholder="Enter interest">
  <button onclick="getData()">Get Recommendations</button>

  <div id="result"></div>

  <script>
    function getData() {
      let val = document.getElementById("input").value;

      document.getElementById("result").innerHTML =
        "<p>Results for: " + val + "</p>" +
        "<ul>" +
        "<li>Internship: AI Intern</li>" +
        "<li>Hackathon: ML Hack</li>" +
        "<li>Course: Data Science</li>" +
        "</ul>";
    }
  </script>

</body>
</html>
